<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ballonkom Matches Admin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <header>
    <div>
      <h1>⚽ Ballonkom</h1>
      <p>إدارة المباريات</p>
    </div>

    <button id="saveBtn" class="save">
      💾 حفظ المباريات
    </button>
  </header>

  <section class="toolbar">
    <input
      id="search"
      type="text"
      placeholder="🔍 البحث عن فريق أو دوري..."
    >

    <button id="addBtn" class="add">
      ＋ إضافة مباراة
    </button>
  </section>

  <div id="matches"></div>

</div>

<div id="modal" class="modal hidden">

  <div class="modal-box">

    <div class="modal-header">
      <h2 id="modalTitle">إضافة مباراة</h2>
      <button id="closeModal">×</button>
    </div>

    <form id="matchForm">

      <label>الدوري</label>
      <input id="league" required>

      <label>أيقونة الدوري</label>
      <input id="leagueIcon" placeholder="🇪🇸">

      <div class="two">
        <div>
          <label>الفريق المضيف</label>
          <input id="home" required>
        </div>

        <div>
          <label>الفريق الضيف</label>
          <input id="away" required>
        </div>
      </div>

      <div class="two">
        <div>
          <label>التوقيت</label>
          <input id="time" type="time" required>
        </div>

        <div>
          <label>الحالة</label>
          <select id="status">
            <option value="upcoming">Upcoming</option>
            <option value="live">Live</option>
            <option value="finished">Finished</option>
          </select>
        </div>
      </div>

      <label>النتيجة</label>
      <input id="score" value="VS">

      <label>القناة</label>
      <input id="channel">

      <label>المعلق</label>
      <input id="commentator">

      <button class="submit" type="submit">
        حفظ المباراة
      </button>

    </form>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
